version: '3.8'

services:
  web:
    build:
      context: ./backend
    container_name: peeljobs_web
    command: gunicorn jobsp.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - whoosh_volume:/app/whoosh_index
    expose:
      - 8000
    env_file:
      - env.production
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
    container_name: peeljobs_worker
    command: celery -A jobsp worker -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      - whoosh_volume:/app/whoosh_index
    env_file:
      - env.production
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ./backend
    container_name: peeljobs_beat
    command: celery -A jobsp beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - env.production
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: peeljobs_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: peeljobs_redis

  nginx:
    image: nginx:alpine
    container_name: peeljobs_nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  whoosh_volume:
